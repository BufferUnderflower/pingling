[package]
name = "ipc-server"
version = "0.1.0"
edition = "2021"
description = "Newline-delimited JSON-RPC 2.0 server exposing the pingle VpnManager over UDS, TCP loopback, and a UDP discovery beacon."

[[bin]]
name = "ipc-server-headless"
path = "src/bin/headless.rs"
required-features = ["headless"]

[features]
default = []
# Headless test daemon: pulls in core-mock + data + plugin-extism so the
# binary can wire a mock VpnManager and (optionally) install a wasm
# plugin from PINGLE_PLUGIN_WASM. Used by the Dart end-to-end smoke
# test and by hand-driven plugin smoke tests.
headless = [
    "dep:core-mock",
    "dep:data",
    "dep:env_logger",
    "dep:plugin-extism",
]
# Opt-in: link + register the LibboxCoreWindows driver into the
# headless binary. Implies `headless`. On non-Windows hosts the
# core-libbox-windows crate compiles to a stub (cfg(libbox_stub))
# that always reports PrerequisiteMissing, so the feature stays
# portable for workspace-wide builds. Enabled by CI for the
# daemon-v* Windows bundle so the real libbox.dll is linked in.
libbox-windows = [
    "headless",
    "dep:core-libbox-windows",
]
# Forwards to core-libbox-windows' strict mode — a missing libbox.dll
# becomes a hard build failure instead of silently compiling the stub.
# Used by CI for the daemon-v* Windows bundle so a stale/missing DLL
# never slips through.
libbox-windows-strict = [
    "libbox-windows",
    "core-libbox-windows/strict",
]

[dependencies]
domain = { path = "../domain" }
service = { path = "../service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Deep-link parsing (pingle://import?config=<base64>...) uses
# percent-decoding for query values and base64 for inline configs.
# Two small crates chosen over `url` (which would pull idna + a lot
# of Unicode tables we don't need for our ASCII-only scheme).
base64 = "0.22"
percent-encoding = "2"
core-mock = { path = "../core-mock", optional = true }
data = { path = "../data", default-features = false, optional = true }
env_logger = { version = "0.11", optional = true }
plugin-extism = { path = "../plugin-extism", optional = true }
# Only linked when the `libbox-windows` feature is on. Unconditional
# path = .. keeps resolver happy in the workspace; it's just never
# compiled unless the feature gate brings it in.
core-libbox-windows = { path = "../core-libbox-windows", optional = true }
# POSIX gethostname(2) for accurate hostname detection on macOS/Linux.
# Only used on unix targets — see discovery.rs `fn hostname()`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
core-mock = { path = "../core-mock" }
data = { path = "../data", default-features = false }
