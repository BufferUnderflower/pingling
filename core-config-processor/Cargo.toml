[package]
name = "core-config-processor"
version = "0.1.0"
edition = "2021"
description = "Generic config processor pipeline for VPN cores: trait + passthrough + extism plugin slot"

[lib]
name = "core_config_processor"
crate-type = ["rlib"]

[dependencies]
domain = { path = "../domain" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
