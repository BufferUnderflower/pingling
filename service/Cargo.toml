[package]
name = "service"
version = "0.1.0"
edition = "2021"

[dependencies]
core-clash-api = { path = "../core-clash-api" }
core-config-processor = { path = "../core-config-processor" }
core-config-processor-impls = { path = "../../core-config-processor-impls" }
domain = { path = "../domain" }
util = { path = "../util" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
data = { path = "../data", default-features = false }
serial_test = "3"
tempfile = "3"
