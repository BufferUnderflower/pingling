[workspace]
members = [
  "crates/host-contract",
  "crates/primitive-host",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BufferUnderflower/pingling"
rust-version = "1.82"

[workspace.dependencies]
pingling-host-contract = { path = "crates/host-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
