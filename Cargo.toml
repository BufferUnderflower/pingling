[workspace]
resolver = "2"
members = [
    "domain",
    "util",
    "data",
    "config",
    "proxy-dto",
    "core-singbox-standalone",
    "core-libbox-windows",
    "core-mock",
    "pingle-netwatch",
    "core-config-processor",
    "pingle-pipeline-plugin",
    "service",
    "ipc-server",
    "plugin-extism",
    "cli",
    "app",
]
# wasm test fixtures live in plugin-extism/tests/fixtures/ as their own
# isolated cargo packages — they target wasm32-unknown-unknown which is
# incompatible with the host workspace's resolver and would otherwise
# break `cargo build --workspace`. The plugin-extism integration tests
# build them on demand via std::process::Command.
exclude = [
    "plugin-extism/tests/fixtures/plugin_mock",
]
