[package]
name = "data"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { path = "../domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-store = { version = "2", optional = true }

[features]
default = []
tauri-persist = ["dep:tauri", "dep:tauri-plugin-store"]
